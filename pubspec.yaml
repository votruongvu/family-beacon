name: family_beacon
description: >-
  Consent-based family location sharing and rapid assistance for iOS and
  Android.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  # Identifier hashing for diagnostics. Pure Dart, so the shared core can use it
  # without breaking its own isolation rule.
  crypto: ^3.0.6
  # Backend clients. These are initialized in lib/app and used from feature data
  # layers; the architecture check keeps them out of every domain layer.
  cloud_firestore: ^6.0.3
  cloud_functions: ^6.0.3
  firebase_app_check: ^0.4.0
  firebase_auth: ^6.1.0
  firebase_core: ^4.1.1
  firebase_crashlytics: ^5.0.3
  firebase_messaging: ^16.0.3
  flutter:
    sdk: flutter
  # State orchestration and dependency resolution. Providers resolve
  # dependencies and expose asynchronous state; business rules stay in domain.
  flutter_riverpod: ^3.0.1
  # Declarative routing. The route table is defined in one place, in the
  # application layer, and never becomes the authority on access.
  go_router: ^17.0.0
  # The initial device-location adapter. Reached only through the
  # LocationSource contract in the shared core, so replacing it is a change
  # in one file in the application layer.
  geolocator: ^14.0.0

dev_dependencies:
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  # Pure Dart tests run on the standalone runner, so the domain suite can be
  # proven to need no Flutter binding.
  test: ^1.25.0

flutter:
  uses-material-design: true
