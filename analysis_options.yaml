# Static analysis for Family Beacon.
#
# The rules below back the Shared Contract of ENG-FND-0001. Two groups matter
# most: the ones that keep failures explicit and typed, and the ones that keep
# the domain layer free of accidental infrastructure coupling. The dependency
# direction itself is enforced separately by the project's architecture check,
# because the analyzer cannot express "this directory may not import that
# package".

include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # An unawaited future in this application usually means a location upload or
    # a state transition was fired and forgotten. Treat it as an error.
    discarded_futures: error
    unawaited_futures: error
    # Sensitive values must never reach stdout; the project has a logger.
    avoid_print: error
    # Silently swallowing an error hides exactly the failures the Foundation
    # requires to be observable.
    empty_catches: error
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/generated_plugin_registrant.dart"
    # Build output. Swift Package Manager checks dependency sources out under
    # build/ios/SourcePackages, and analysing other people's packages produces
    # thousands of findings nobody in this project can act on.
    - "build/**"
    - ".dart_tool/**"

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_slow_async_io
    - cancel_subscriptions
    - close_sinks
    - comment_references
    - directives_ordering
    - implicit_call_tearoffs
    - only_throw_errors
    - prefer_final_in_for_each
    - prefer_final_locals
    - prefer_single_quotes
    - require_trailing_commas
    - throw_in_finally
    - unnecessary_await_in_return
    - unnecessary_lambdas
    - unnecessary_parenthesis
    - unnecessary_statements
    - use_enums
    - use_named_constants
    - use_super_parameters
